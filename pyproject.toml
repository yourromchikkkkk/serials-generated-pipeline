[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serials-generated-pipeline"
version = "0.1.0"
description = "Agent that turns a short idea into a spoken-line-verbatim vertical video."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "litellm>=1.50",
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "langsmith>=0.1",
    "redis>=5.0",
    "fal-client>=0.5",
    "ffmpeg-python>=0.2",
    "pymongo>=4.17.0",
    "minio>=7.2.20",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pipeline = "pipeline.cli:main"
